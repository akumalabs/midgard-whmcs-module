name: Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate and test
        run: |
          composer validate --strict
          composer audit --no-interaction
          find modules/servers/midgard -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit --no-coverage

      - name: Build installable ZIP
        run: |
          mkdir -p dist
          zip -r "dist/midgard-whmcs-module-${GITHUB_REF_NAME}.zip" modules/servers/midgard

      - name: Smoke check ZIP structure
        run: |
          unzip -l "dist/midgard-whmcs-module-${GITHUB_REF_NAME}.zip" | grep "modules/servers/midgard/midgard.php"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midgard-whmcs-module-${{ github.ref_name }}
          path: dist/midgard-whmcs-module-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT != '' && secrets.RELEASE_PAT || github.token }}
          files: dist/midgard-whmcs-module-${{ github.ref_name }}.zip
          body: |
            Automated release for `${{ github.ref_name }}`.

